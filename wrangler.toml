name = "ai-proxy"
main = "src/index.ts"
compatibility_date = "2026-01-01"

kv_namespaces = [
  { binding = "RATE_LIMIT", id = "ba0224c06da94fc1b0ce4944a837db0d" }
]

[vars]
# Full URL of the upstream chat endpoint.
UPSTREAM_URL = "https://api.anthropic.com/v1/messages"
# "x-api-key" sends x-api-key + anthropic-version (Anthropic).
# "bearer" sends Authorization: Bearer <key> (OpenAI-compatible APIs).
UPSTREAM_AUTH_SCHEME = "x-api-key"
# Comma-separated list of exact origins allowed to call this Worker.
ALLOWED_ORIGINS = "https://0xmortuex.github.io"
# Comma-separated allowlist of model ids callers may request. Anything else -> 400.
ALLOWED_MODELS = "claude-sonnet-4-6"
# Hard ceiling on a request's max_tokens. Over this -> 400 (never silently clamped).
MAX_OUTPUT_TOKENS = "2048"
# Requests per hour per client IP.
RATE_LIMIT_MAX = "5"
# Absolute cap on upstream-bound /v1/chat requests per UTC day across ALL callers.
# Closes the IP-rotation gap the per-IP limit alone can't: over it -> 429 until UTC midnight.
GLOBAL_DAILY_MAX = "200"
# Upstream timeout in milliseconds (time to response headers for streams).
UPSTREAM_TIMEOUT_MS = "60000"

# Secrets, never vars:
#   wrangler secret put UPSTREAM_API_KEY   # upstream API key
#   wrangler secret put STATS_TOKEN        # token guarding GET /stats
